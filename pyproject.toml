[project]
name = "yonder"
version = "0.1.0"
description = "Daily AI, finance, and GitHub reading dashboard for 今日宜闻."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yonder = "yonder.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
